---
name: PR Checks
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgsl0-dev valgrind
      - run: |
          make dev
      - run: |
          cmake -S . -B build -DBUILD_EXAMPLES=ON
          cmake --build build -j4 --target cpp_modern cpp_special_events filtered_search err_reason_example
